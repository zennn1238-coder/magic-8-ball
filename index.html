<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8 Ball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
    
    <div class="container">
        <h1>MAGIC 8 BALL</h1>
        <p class="subtitle">Ask a question and discover your answer.</p>

        <button class="magic-ball" id="magicBall">
            <div class="number">8</div>
            <div class="answer-window">
                <span id="answer">TAP ME</span>
            </div>
        </button>

        <p class="instruction" id="instruction">
            Tap the Magic 8 Ball to reveal your answer.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
